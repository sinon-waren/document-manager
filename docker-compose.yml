version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: document-postgres
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: documentuser
      POSTGRES_PASSWORD: documentpass
    ports: 
      - "5433:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data

volumes: 
  postgres_data: